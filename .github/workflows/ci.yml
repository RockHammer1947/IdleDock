name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          brew install ffmpeg
      - name: Check public files and documentation links
        run: python scripts/check-public.py
      - name: Fake-runtime tests (no models)
        run: python -m unittest discover -s tests -v
      - name: Export checked source snapshot
        run: python scripts/export-source.py
      - name: Build native app and verify signature
        env:
          DEVELOPER_DIR: /Library/Developer/CommandLineTools
        run: |
          export H3_QUEUE_PYTHON="$(command -v python)"
          ./scripts/build-app.sh
          codesign --verify --deep --strict 'dist/H3 Queue.app'
          xcrun swiftc -parse-as-library -module-cache-path .build/module-cache macos/SystemUsage.swift tests/SystemUsageTests.swift -o .build/system-usage-tests
          .build/system-usage-tests
      - name: Native localization checks (isolated preferences, no worker)
        run: ./scripts/test-localization.sh

  linux:
    name: Linux ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Public source checks
        run: python scripts/check-public.py
      - name: Full model-free suite
        run: python -m unittest discover -s tests -v
      - name: Check POSIX launcher and service syntax
        run: |
          sh -n queue scripts/python-path.sh
          systemd-analyze --user verify examples/linux/idledock.service 2>&1 | tee /tmp/service-check.log
          # Paths point to the eventual user checkout, not this hosted runner.
          ! grep -E 'Unknown|Failed to parse|Invalid' /tmp/service-check.log
      - name: Export checked source
        run: python scripts/export-source.py
